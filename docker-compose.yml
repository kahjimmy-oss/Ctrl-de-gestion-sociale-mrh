version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cosmetica_rh
    networks:
      - cosmetica_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/cosmetica_rh
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - cosmetica_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cosmetica_net

volumes:
  mongo_data:
  uploads_data:

networks:
  cosmetica_net:
    driver: bridge
